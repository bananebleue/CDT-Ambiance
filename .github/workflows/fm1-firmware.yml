# Spring's Sonar (fm1/) : compiler le firmware du M-VAVE FM-1 sur GitHub, lancer les bancs d'essai,
# et, sur une étiquette fm1-vX.Y, publier le paquet. La chaîne de compilation JieLi vient de pkgman.jieliapp.com
# (tools/get_toolchain.sh), trois fichiers du SDK AC79 de gitee.com, comme pour Dinghy, sloopDX et OberVave.
name: fm1-firmware

on:
  push:
    branches: ['firmware', 'main']
    paths: ['fm1/**', '.github/workflows/fm1-firmware.yml']
    tags: ['fm1-v*']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fm1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Paquets Python
        run: python3 -m pip install Pillow

      - name: Tables du sonar à jour
        run: |
          python3 tools/gen_sonar_tables.py
          git diff --exit-code firmware/sonar/sonar_tables.h

      - name: Bancs d'essai du sonar (sans matériel)
        run: |
          mkdir -p build/tests
          cc -O2 -Wall -Wextra -Wno-unused-function -Wno-unused-parameter -Ifirmware/sonar -o build/tests/sonar_core_test tests/sonar_core_test.c
          build/tests/sonar_core_test build/tests/sonar_core.wav
          cc -O2 -Wall -Wextra -Wno-unused-function -Wno-unused-parameter -Ifirmware/sonar -o build/tests/sonar_ui_host tests/sonar_ui_host.c
          build/tests/sonar_ui_host build/tests/ui tests/sonar_ui_script.txt
          cc -O2 -Wall -Wextra -Wno-unused-function -Wno-unused-parameter -Ifirmware/sonar -o build/tests/sonar_sync_test tests/sonar_sync_test.c
          build/tests/sonar_sync_test tests/presets_sync_fixture.txt
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in sorted(Path("build/tests").glob("ui-*.ppm")):
              Image.open(p).resize((480, 480), Image.NEAREST).save(p.with_suffix(".png")); p.unlink()
          PY

      - name: Chaîne JieLi (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: SDK JieLi AC79 (trois de ses fichiers vont dans le paquet)
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Compiler le firmware (FM-1)
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            sh build.sh --release "${GITHUB_REF_NAME#fm1-v}"
          else
            sh build.sh
          fi
          ls -l build/*.fwsc
          (cd build && sha256sum *.fwsc > SHA256SUMS)

      - name: Mise à jour depuis Spring's Sonar (ota.c) - son propre paquet, et le firmware officiel de M-VAVE
        run: |
          cc -O2 -w -o build/tests/ota_test tests/ota_test.c
          sonar=$(ls build/spring-sonar*.fwsc | head -1)
          build/tests/ota_test "$sonar"
          # FM-1.fwsc de M-VAVE : téléchargé pour ce test seulement, jamais publié ni gardé en artefact
          if curl -sSf -m 120 -o "$RUNNER_TEMP/FM-1.fwsc" https://yms-file-store.oss-cn-hongkong.aliyuncs.com/software/firmware/FM-1.fwsc; then
            sha256sum "$RUNNER_TEMP/FM-1.fwsc"
            build/tests/ota_test "$RUNNER_TEMP/FM-1.fwsc" "$sonar"
            echo "--- l'ancienne règle (avant le 4 nov.), pour mémoire : elle doit refuser"
            mkdir -p "$RUNNER_TEMP/old/firmware/src" "$RUNNER_TEMP/old/tests"
            git show 28e9a3d:fm1/firmware/src/ota.c > "$RUNNER_TEMP/old/firmware/src/ota.c"
            cp tests/ota_test.c "$RUNNER_TEMP/old/tests/"
            cc -O2 -w -o "$RUNNER_TEMP/old_ota_test" "$RUNNER_TEMP/old/tests/ota_test.c"
            "$RUNNER_TEMP/old_ota_test" "$RUNNER_TEMP/FM-1.fwsc" "$sonar" | grep -E "requests|session commits" || true
            rm -f "$RUNNER_TEMP/FM-1.fwsc"
          else
            echo "::warning::FM-1.fwsc de M-VAVE injoignable : test du retour officiel sauté"
          fi

      - name: Écran de plantage → fonctions (tools/crash.txt)
        if: hashFiles('fm1/tools/crash.txt') != ''
        run: python3 tools/crash_lookup.py $(grep -v '^#' tools/crash.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: spring-sonar-fwsc
          path: |
            fm1/build/*.fwsc
            fm1/build/SHA256SUMS
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spring-sonar-bancs-essai
          path: |
            fm1/build/tests/*.png
            fm1/build/tests/*.wav

      # CDT Compagnon installe « la dernière version » depuis la branche fm1-builds (un seul commit, remplacé à
      # chaque compilation de la branche firmware ou d'une étiquette) : latest.json + spring-sonar.fwsc, lus par
      # la page sur raw.githubusercontent.com.
      - name: Dernière version pour CDT Compagnon (branche fm1-builds)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/firmware' || github.ref_type == 'tag')
        run: |
          pub="$RUNNER_TEMP/fm1-builds"
          mkdir -p "$pub"
          cp "$(ls build/spring-sonar*.fwsc | head -1)" "$pub/spring-sonar.fwsc"
          python3 - "$pub" <<'PY'
          import hashlib, json, os, sys, datetime
          d = sys.argv[1]
          raw = open(os.path.join(d, "spring-sonar.fwsc"), "rb").read()
          json.dump({"file": "spring-sonar.fwsc", "product": "FM-1_960", "size": len(raw),
                     "sha256": hashlib.sha256(raw).hexdigest(),
                     "commit": os.environ["GITHUB_SHA"][:7], "ref": os.environ["GITHUB_REF_NAME"],
                     "message": os.environ.get("MSG", "").splitlines()[0][:120] if os.environ.get("MSG") else "",
                     "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "run": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]},
                    open(os.path.join(d, "latest.json"), "w"), ensure_ascii=False, indent=1)
          PY
          cat "$pub/latest.json"
          cd "$pub"
          git init -q -b fm1-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json spring-sonar.fwsc
          git commit -q -m "Spring's Sonar ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" fm1-builds
        env:
          MSG: ${{ github.event.head_commit.message }}

      - name: Publier (étiquettes fm1-v* seulement)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fm1/build/spring-sonar-*.fwsc
            fm1/build/SHA256SUMS
