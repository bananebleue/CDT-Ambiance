name: probe-mvave
on: { push: { branches: ['probe-mvave'] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Le paquet officiel passe-t-il les contrôles de fm1ota.js ? (rien n'est publié)
        run: |
          curl -sS -o /tmp/fw.bin https://yms-file-store.oss-cn-hongkong.aliyuncs.com/software/firmware/FM-1.fwsc
          node -e "
          const O=require('./fm1ota.js');const raw=new Uint8Array(require('fs').readFileSync('/tmp/fw.bin'));
          console.log('identité', O.productOf(raw));
          try { O.loadPackage(raw); } catch(e) { console.log('sans force :', e.code); }
          const r=O.loadPackage(raw,true); const d=O.deinterleave(raw);
          console.log('avec force : OK, image', r.image.length, 'blocs', d.blocks, 'dommage', O.packageDamage(r.image));"
